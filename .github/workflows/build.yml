name: Build & Deploy Flutter App to Play Store

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build AAB & Upload
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'any'
        cache: true

    - name: Decode Keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

    - name: Create key.properties
      run: echo "${{ secrets.KEY_PROPERTIES }}" > android/key.properties

    - name: Create .env file
      run: echo "${{ secrets.ENV_FILE }}" > .env

    - name: Install dependencies
      run: flutter pub get

    - name: Generate code
      run: dart run build_runner build --delete-conflicting-outputs

    - name: Build AAB
      run: flutter build appbundle --release

    - name: Upload to Play Store
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        packageName: com.tasker.app.tasker_app
        releaseFiles: build/app/outputs/bundle/release/*.aab
        track: internal